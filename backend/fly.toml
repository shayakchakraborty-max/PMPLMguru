# Fly.io config for the PMGuru brain (always-on, no sleep).
# Uses the existing Dockerfile. Deploy with:  cd backend && fly launch --copy-config --no-deploy ; fly deploy
app = "pmguru-brain"
primary_region = "sin"   # Singapore — lowest latency to India; change if you prefer

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000          # main.py listens on $PORT or 8000
  force_https = true
  auto_stop_machines = false    # keep it always-on (no cold starts)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
